[versions]
agp = "9.2.1"
coreKtx = "1.18.0"
lifecycleRuntimeKtx = "2.10.0"
activityCompose = "1.13.0"
kotlin = "2.4.0"
composeBom = "2026.06.00"
room_version = "2.8.4"
ksp = "2.3.4"
retrofit = "3.0.0"
viewmodel-compose = "2.10.0"
serialization-converter = "1.0.0"
okhttp = "5.4.0"
serialization-json = "1.11.0"
coil = "2.7.0"
serialization = "2.4.0"
work-runtime = "2.11.2"
hilt = "2.60"
navigation = "2.9.8"
font-awesome = "1.1.1"
icons-extended = "1.7.8"
hilt-navigation-compose = "1.3.0"
splashscreen = "1.2.0"

[libraries]
# Core Android
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
# Lifecycle / ViewModel
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "viewmodel-compose" }
# Compose UI
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# Icons
font-awesome = { module = "br.com.devsrsouza.compose.icons:font-awesome", version.ref = "font-awesome" }
icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "icons-extended" }
# BOM - dependency management tool
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# Debug
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# Testing
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
# Room
room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room_version" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room_version" }
# Retrofit
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
# Retrofit with Kotlin serialization Converter
serialization-converter = { module = "com.jakewharton.retrofit:retrofit2-kotlinx-serialization-converter", version.ref = "serialization-converter" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
#Kotlin serialization
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization-json" }
##Coil
coil = { module = "io.coil-kt:coil-compose", version.ref = "coil" }
# WorkManager - runs background tasks that survive app restarts (e.g. syncing Room DB with remote API)
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work-runtime" }
# Dependency injection
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
# Navigation
navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hilt-navigation-compose" }
# SplashScreen
core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

[plugins]
# KSP (Kotlin Symbol Processing)
devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Android application - enables building Android apps (APK/AAB), resources, manifests etc.
android-application = { id = "com.android.application", version.ref = "agp" }
# Kotlin Compose compiler
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Kotlin serialization
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "serialization" }
# Dependency injection
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
